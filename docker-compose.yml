services:
  backend:
    image: umair9211/cloud-monitoring-backend:latest
    container_name: cloud-monitoring-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      AWS_REGION: ap-southeast-2
      EC2_INSTANCE_ID: i-020d55ffd221d3f0a
  frontend:
    image: umair9211/cloud-monitoring-frontend:latest
    container_name: cloud-monitoring-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

