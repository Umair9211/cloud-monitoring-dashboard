name: Docker Image CI

on:
  workflow_run:
    workflows: ["Cloud Monitoring Dashboard CI"]
    types:
      - completed

  workflow_dispatch:

jobs:
  build:
    # Publish only when the test workflow succeeds on main.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push'
      )

    runs-on: ubuntu-latest

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: umair9211/cloud-monitoring-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: umair9211/cloud-monitoring-frontend:latest
  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
  
    steps:
      - name: Deploy application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e
  
            cd /home/ec2-user/cloud-monitoring
  
            echo "Pulling latest images..."
            sudo docker compose pull
  
            echo "Updating containers..."
            sudo docker compose up -d --remove-orphans
  
            echo "Checking application health..."
            curl --fail --silent --show-error \
              http://localhost/api/health
  
            echo "Deployment successful!"
